<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" width="100%" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="816" height="136" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left icon: terminal prompt -->
  <g transform="translate(38, 42)">
    <circle cx="14" cy="14" r="22" fill="#1b2336" stroke="#2a3652" stroke-width="1"/>
    <path d="M 8 8 L 16 14 L 8 20" fill="none" stroke="#00f2fe" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="20" x2="24" y2="20" stroke="#ff2d78" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="96" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5px">Timofei</text>
  <text x="97" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2px">linux · networking · open-source · sheregesh, siberia</text>

  <!-- Right status pill -->
  <g transform="translate(635, 52)">
    <rect x="0" y="0" width="145" height="36" rx="18" fill="#182030" stroke="#2b3b5c" stroke-width="1"/>
    <circle cx="18" cy="18" r="4.5" fill="#10b981"/>
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">building &amp; coding</text>
  </g>
</svg>
